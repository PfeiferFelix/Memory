<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Settings</title>
</head>

<body>
    <div class="site-layout">
        <section class="left-side">
            <h1 class="settings_headline">Settings</h1>
            <div class="headline_rule" aria-hidden="true"></div>

            <div class="theme_group">
                <div class="theme_group_head">
                    <img class="theme_group_icon" src="/images/icon_game_themes.svg" alt="">
                    <h2 class="theme_group_title">Game themes</h2>
                </div>

                <ul class="theme_list">
                    <li>
                        <label class="theme_option" data-theme="code">
                            <input id="code_vibes_theme" type="radio" name="game_theme" value="code_vibes">
                            <span class="theme_option_mark"></span>
                            <span class="theme_option_label">Code vibes theme</span>
                            <img class="theme_option_arrow" src="/images/line_arrow.svg" alt="">
                        </label>
                    </li>
                    <li>
                        <label class="theme_option" data-theme="gaming">
                            <input id="gaming_vibes_theme" type="radio" name="game_theme" value="gaming">
                            <span class="theme_option_mark"></span>
                            <span class="theme_option_label">Gaming theme</span>
                            <img class="theme_option_arrow" src="/images/line_arrow.svg" alt="">
                        </label>
                    </li>
                </ul>
            </div>

            <div class="theme_group">
                <div class="theme_group_head">
                    <img class="theme_group_icon" src="/images/icon_chess_pawn.svg" alt="">
                    <h2 class="theme_group_title">Choose player</h2>
                </div>

                <ul class="theme_list">
                    <li>
                        <label class="theme_option">
                            <input id="character_blue" type="radio" name="player" value="blue">
                            <span class="theme_option_mark"></span>
                            <span class="theme_option_label">Blue</span>
                            <img class="theme_option_arrow" src="/images/line_arrow.svg" alt="">
                        </label>
                    </li>
                    <li>
                        <label class="theme_option">
                            <input id="character_orange" type="radio" name="player" value="orange">
                            <span class="theme_option_mark"></span>
                            <span class="theme_option_label">Orange</span>
                            <img class="theme_option_arrow" src="/images/line_arrow.svg" alt="">
                        </label>
                    </li>
                </ul>
            </div>

            <div class="theme_group">
                <div class="theme_group_head">
                    <img class="theme_group_icon" src="/images/icon_board_size.svg" alt="">
                    <h2 class="theme_group_title">Board size</h2>
                </div>

                <ul class="theme_list">
                    <li>
                        <label class="theme_option">
                            <input id="16_cards" type="radio" name="board_size" value="16">
                            <span class="theme_option_mark"></span>
                            <span class="theme_option_label">16 cards</span>
                            <img class="theme_option_arrow" src="/images/line_arrow.svg" alt="">
                        </label>
                    </li>
                    <li>
                        <label class="theme_option">
                            <input id="24_cards" type="radio" name="board_size" value="24">
                            <span class="theme_option_mark"></span>
                            <span class="theme_option_label">24 cards</span>
                            <img class="theme_option_arrow" src="/images/line_arrow.svg" alt="">
                        </label>
                    </li>
                    <li>
                        <label class="theme_option">
                            <input id="32_cards" type="radio" name="board_size" value="32">
                            <span class="theme_option_mark"></span>
                            <span class="theme_option_label">32 cards</span>
                            <img class="theme_option_arrow" src="/images/line_arrow.svg" alt="">
                        </label>
                    </li>
                </ul>
            </div>
        </section>

        <section class="right-side">
            <img id="Theme1" class="settings_theme1_cover" src="/images/Theme1/Theme_Cover.png" alt="Code vibes theme">
            <img id="Theme2" class="settings_theme1_cover" src="/images/Theme2.png" alt="Gaming theme">
            <div class="selected">
                <p id="game_theme" data-longest="Gaming theme">Game theme </p><img src="/images/Line 6.png" alt="">
                <p id="player" data-longest="Orange">Player </p><img src="/images/Line 6.png" alt="">
                <p id="board" data-longest="Board size">Board size </p><img src="/images/Line 6.png" alt="">
                <button id="start_game_btn">
                    <a id="gameLink"><img src="/images/small button.png" alt=""></a>
                </button>
            </div>
        </section>
    </div>


    <script type="module" src="/src/settings.ts"></script>
</body>

</html>
