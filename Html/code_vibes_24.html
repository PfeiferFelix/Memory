<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/png" href="/images/Code vibes card background.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Red+Rose:wght@300..700&display=swap" rel="stylesheet">
        <title>Code Vibes 24 Cards</title>
    </head>
    <body>
        <header>
            <div class="playerStats">
                <img src="/images/label_blue.png" alt="" />
                <p class="playerBlue">Blue</p>
                <p class="numberBlue">0</p>
                <img src="/images/label_orange.png" alt="" />
                <p class="playerOrange">Orange</p>
                <p class="numberOrange">0</p>
            </div>
            <div class="currentPlayer">
                <p>Current player:</p>
                <p class="currentPlayerTag">
                    <img src="/images/label_blue.png" alt="" />
                </p>
            </div>
            <div id="openPopupButton">
                <a class="exit_button"
                    ><img src="/images/exit_button.png" alt=""
                /></a>
            </div>
        </header>

        <section id="field"></section>

        <div id="popup" class="Thumbnail none">
            <div class="box">
                <div class="box_head">
                    <span id="popupTitle">Exit Game?</span>
                </div>

                <div class="box_main">
                    <img id="backToGameButton" class="Thumbnail_Img" src="/images/Theme1/PopupBacktoGame.png" alt="Back to game">
                    <img id="exitToMenuButton" class="Thumbnail_Img" src="/images/Theme1/button exit/Code vibes  theme.png" alt="Exit to menu">
                </div>
            </div>
        </div>

        <script type="module" src="/src/code_vibes_24.ts"></script>
    </body>
</html>
