<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/images/Code vibes card background.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Red+Rose:wght@300..700&display=swap" rel="stylesheet">
    <title>Memory Settings</title>
</head>

<body>
    <div class="settings">
        <section class="settings__main">
            <h1 class="settings__headline">Settings</h1>
            <div class="settings__rule" aria-hidden="true"></div>

            <div class="theme-group">
                <div class="theme-group__head">
                    <img class="theme-group__icon" src="/images/icon_game_themes.svg" alt="">
                    <h2 class="theme-group__title">Game themes</h2>
                </div>

                <ul class="theme-group__list">
                    <li>
                        <label class="theme-option" data-theme="code">
                            <input id="code_vibes_theme" type="radio" name="game_theme" value="code_vibes">
                            <span class="theme-option__mark"></span>
                            <span class="theme-option__label">Code vibes theme</span>
                            <img class="theme-option__arrow" src="/images/line_arrow.svg" alt="">
                        </label>
                    </li>
                    <li>
                        <label class="theme-option" data-theme="gaming">
                            <input id="gaming_vibes_theme" type="radio" name="game_theme" value="gaming">
                            <span class="theme-option__mark"></span>
                            <span class="theme-option__label">Gaming theme</span>
                            <img class="theme-option__arrow" src="/images/line_arrow.svg" alt="">
                        </label>
                    </li>
                </ul>
            </div>

            <div class="theme-group">
                <div class="theme-group__head">
                    <img class="theme-group__icon" src="/images/icon_chess_pawn.svg" alt="">
                    <h2 class="theme-group__title">Choose player</h2>
                </div>

                <ul class="theme-group__list">
                    <li>
                        <label class="theme-option">
                            <input id="character_blue" type="radio" name="player" value="blue">
                            <span class="theme-option__mark"></span>
                            <span class="theme-option__label">Blue</span>
                            <img class="theme-option__arrow" src="/images/line_arrow.svg" alt="">
                        </label>
                    </li>
                    <li>
                        <label class="theme-option">
                            <input id="character_orange" type="radio" name="player" value="orange">
                            <span class="theme-option__mark"></span>
                            <span class="theme-option__label">Orange</span>
                            <img class="theme-option__arrow" src="/images/line_arrow.svg" alt="">
                        </label>
                    </li>
                </ul>
            </div>

            <div class="theme-group">
                <div class="theme-group__head">
                    <img class="theme-group__icon" src="/images/icon_board_size.svg" alt="">
                    <h2 class="theme-group__title">Board size</h2>
                </div>

                <ul class="theme-group__list">
                    <li>
                        <label class="theme-option">
                            <input id="16_cards" type="radio" name="board_size" value="16">
                            <span class="theme-option__mark"></span>
                            <span class="theme-option__label">16 cards</span>
                            <img class="theme-option__arrow" src="/images/line_arrow.svg" alt="">
                        </label>
                    </li>
                    <li>
                        <label class="theme-option">
                            <input id="24_cards" type="radio" name="board_size" value="24">
                            <span class="theme-option__mark"></span>
                            <span class="theme-option__label">24 cards</span>
                            <img class="theme-option__arrow" src="/images/line_arrow.svg" alt="">
                        </label>
                    </li>
                    <li>
                        <label class="theme-option">
                            <input id="32_cards" type="radio" name="board_size" value="32">
                            <span class="theme-option__mark"></span>
                            <span class="theme-option__label">32 cards</span>
                            <img class="theme-option__arrow" src="/images/line_arrow.svg" alt="">
                        </label>
                    </li>
                </ul>
            </div>
        </section>

        <section class="settings__preview">
            <img id="Theme1" class="settings__cover" src="/images/Theme1/Theme_Cover.png" alt="Code vibes theme">
            <img id="Theme2" class="settings__cover" src="/images/Theme2.png" alt="Gaming theme">
            <div class="settings__summary">
                <p id="game_theme" data-longest="Gaming theme">Game theme </p><img src="/images/Line 6.png" alt="">
                <p id="player" data-longest="Orange">Player </p><img src="/images/Line 6.png" alt="">
                <p id="board" data-longest="Board size">Board size </p><img src="/images/Line 6.png" alt="">
                <button id="start_game_btn" disabled>
                    <a id="gameLink" class="swap-button">
                        <img class="swap-button__default" src="/images/Start_Button_Blur.png" alt="Spiel starten">
                        <img class="swap-button__hover" src="/images/StartButtonHover.png" alt="" aria-hidden="true">
                    </a>
                </button>
            </div>
        </section>
    </div>


    <script type="module" src="/src/settings.ts"></script>
</body>

</html>
