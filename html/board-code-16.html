<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/png" href="/images/Code vibes card background.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Red+Rose:wght@300..700&display=swap" rel="stylesheet">
        <title>Code Vibes 16 Cards</title>
    </head>
    <body>
        <header>
            <div class="player-stats">
                <img src="/images/label_blue.png" alt="" />
                <p class="player-stats__name--blue">Blue</p>
                <p class="player-stats__score--blue">0</p>
                <img src="/images/label_orange.png" alt="" />
                <p class="player-stats__name--orange">Orange</p>
                <p class="player-stats__score--orange">0</p>
            </div>
            <div class="current-player">
                <p>Current player:</p>
                <p class="current-player__tag">
                    <img src="/images/label_blue.png" alt="" />
                </p>
            </div>
            <div id="openPopupButton">  <a class="exit-button"
                ><img src="/images/exit_button.png" alt=""
            /></a></div>
          
        </header>

        <section id="field"></section>

        <div id="popup" class="popup popup--hidden">
            <div class="popup__box">
                <div class="popup__head">
                    <span id="popupTitle">Exit Game?</span>
                </div>

                <div class="popup__body">
                    <img id="backToGameButton" class="popup__action" src="/images/Theme1/PopupBacktoGame.png" alt="Back to game">
                    <img id="exitToMenuButton" class="popup__action" src="/images/Theme1/button exit/Code vibes  theme.png" alt="Exit to menu">
                </div>
            </div>
        </div>

        <script type="module" src="/src/code-vibes-16.ts"></script>
    </body>
</html>
